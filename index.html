<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio Home</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Space+Grotesk:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#111110}
html{-webkit-tap-highlight-color:transparent}
a,button{touch-action:manipulation}
a:focus-visible{outline:2px solid #EDEDEA;outline-offset:3px;border-radius:4px}
.row-title{display:inline-block;line-height:24px;transform-origin:left center;transition:transform .25s cubic-bezier(.23,1,.32,1)}
.row-title::after{content:"↗";content:"↗" / "";display:inline-block;margin-left:8px;font-family:Inter,system-ui,sans-serif;font-size:.75em;font-weight:400;line-height:1;color:#A3A39C;opacity:0;transform:translateX(-4px);transition:opacity .2s cubic-bezier(.23,1,.32,1),transform .2s cubic-bezier(.23,1,.32,1)}
.row:focus-visible .row-title{transform:translateX(4px)}
.row:focus-visible .row-title::after{opacity:1;transform:none}
@media (hover:hover) and (pointer:fine){
.row:hover .row-title{transform:translateX(4px)}
.row:hover .row-title::after{opacity:1;transform:none}
}
.row:active .row-title{transform:translateX(4px) scale(.98)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.textlink{color:#A3A39C;transition:color .15s cubic-bezier(.23,1,.32,1)}
.ask{display:flex;flex-direction:column;gap:16px}
.ask-log{height:156px;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:16px;font-size:15px;line-height:1.6;overflow-wrap:anywhere;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 48px);mask-image:linear-gradient(to bottom,transparent 0,#000 48px)}
.ask-q{margin:0;color:#EDEDEA}
.ask-a{margin:0;color:#A3A39C;white-space:pre-wrap}
.ask-a span{animation:ask-in .25s cubic-bezier(.23,1,.32,1) both}
.ask-a.typing::after{content:"";display:inline-block;width:6px;height:6px;margin-left:4px;border-radius:50%;background:#6B6B66;vertical-align:middle;animation:ask-pulse 1s ease-in-out infinite}
@keyframes ask-in{from{opacity:0;filter:blur(2px)}to{opacity:1;filter:none}}
@keyframes ask-pulse{50%{opacity:.3}}
.ask-form{display:flex;align-items:center;gap:8px;border-bottom:1px solid #2E2E2B;transition:border-color .2s cubic-bezier(.23,1,.32,1)}
.ask-form:focus-within{border-color:#A3A39C}
.ask-form input{flex:1;min-width:0;min-height:48px;padding:0;background:none;border:0;outline:0;color:#EDEDEA;font:inherit;font-size:16px}
.ask-form input::placeholder{color:#8A8A84}
.ask-form button{min-width:48px;min-height:48px;background:none;border:0;color:#A3A39C;font:inherit;font-size:18px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .16s cubic-bezier(.23,1,.32,1),color .15s cubic-bezier(.23,1,.32,1)}
.ask-form button:active{transform:scale(.95)}
.ask-form button:disabled{opacity:.4;cursor:default}
.ask-form button:focus-visible{outline:2px solid #EDEDEA;outline-offset:2px;border-radius:4px}
@media (hover:hover) and (pointer:fine){.ask-form button:hover{color:#EDEDEA}.textlink:hover{color:#EDEDEA}}
@media (prefers-reduced-motion:reduce){.row-title{transform:none!important;transition:none}.row-title::after{transform:none;transition:none}.ask-form button:active{transform:none!important}.ask-a span{animation:none}.ask-a.typing::after{animation:none}}
</style>
</head>
<body>
<div style="min-height: 100dvh; box-sizing: border-box; padding: 48px 24px; display: flex; flex-direction: column; background: #111110; color: #EDEDEA; font-family: Inter, system-ui, sans-serif;">

  <main style="width: 100%; max-width: 560px; margin: 0 auto; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 40px;">

    <p style="margin: 0; font-size: 16px; line-height: 24px; color: #A3A39C;">Here's what I'm working on right now:</p>

    <nav aria-label="Projects" style="display: flex; flex-direction: column;">
      <a class="row" href="https://textari.tech" target="_blank" rel="noopener" style="display: flex; flex-direction: column; gap: 4px; padding: 12px 0; color: inherit; text-decoration: none;">
        <span class="row-title" style="font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 22px;">Ari</span>
      </a>
      <a class="row" href="https://github.com/hectoragofi/inkling-local" target="_blank" rel="noopener" style="display: flex; flex-direction: column; gap: 4px; padding: 12px 0; color: inherit; text-decoration: none;">
        <span class="row-title" style="font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 22px;">Optimizing Inkling 2</span>
      </a>
      <a class="row" href="https://github.com/hectoragofi/metallm" target="_blank" rel="noopener" style="display: flex; flex-direction: column; gap: 4px; padding: 12px 0; color: inherit; text-decoration: none;">
        <span class="row-title" style="font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 22px;">metallm</span>
      </a>
      <a class="row" href="https://stash.hectoragofi.workers.dev" target="_blank" rel="noopener" style="display: flex; flex-direction: column; gap: 4px; padding: 12px 0; color: inherit; text-decoration: none;">
        <span class="row-title" style="font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 22px;">Stash</span>
      </a>
      <a class="row" href="https://github.com/hectoragofi/apeiron" target="_blank" rel="noopener" style="display: flex; flex-direction: column; gap: 4px; padding: 12px 0; color: inherit; text-decoration: none;">
        <span class="row-title" style="font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 22px;">Apeiron</span>
      </a>
    </nav>

    <section aria-label="Ask about me" class="ask">
      <div id="ask-log" class="ask-log" aria-live="polite"></div>
      <form id="ask-form" class="ask-form" autocomplete="off">
        <label for="ask-input" class="sr">Ask a question about me</label>
        <input id="ask-input" name="q" type="text" maxlength="500" placeholder="Ask me anything about my work…" required>
        <button type="submit" aria-label="Send">↵</button>
      </form>
    </section>

  </main>

  <footer style="width: 100%; max-width: 560px; margin: 0 auto; padding-top: 32px; display: flex; gap: 0 24px; flex-wrap: wrap; font-size: 15px;">
    <a class="textlink" href="mailto:hectoragofi@gmail.com" style="display: inline-flex; align-items: center; min-height: 48px; text-decoration: none;">hectoragofi@gmail.com</a>
    <a class="textlink" href="https://github.com/hectoragofi" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; min-height: 48px; text-decoration: none;">GitHub</a>
    <a class="textlink" href="https://www.linkedin.com/in/hector-raftakopoulos-gonzalez-4bb1102b9/" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; min-height: 48px; text-decoration: none;">LinkedIn</a>
    <a class="textlink" href="https://x.com/hectoragofi" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; min-height: 48px; text-decoration: none;">X</a>
  </footer>

</div>
<script>
(() => {
  const API = "https://portfolio-chat.hectoragofi.workers.dev";
  const form = document.getElementById("ask-form");
  const input = document.getElementById("ask-input");
  const log = document.getElementById("ask-log");
  const btn = form.querySelector("button");
  const history = [];
  const line = (cls, text) => {
    const p = document.createElement("p");
    p.className = cls;
    if (text) p.textContent = text;
    log.appendChild(p);
    return p;
  };
  const append = (el, text) => {
    const s = document.createElement("span");
    s.textContent = text;
    el.appendChild(s);
  };
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q || btn.disabled) return;
    input.value = "";
    btn.disabled = true;
    line("ask-q", q);
    const a = line("ask-a typing");
    history.push({ role: "user", content: q });
    let full = "";
    try {
      const r = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history.slice(-6) }),
      });
      if (!r.ok || !(r.headers.get("Content-Type") || "").startsWith("text/plain")) {
        const j = await r.json().catch(() => ({}));
        append(a, j.reply || "Something went wrong. Try again later.");
        history.pop();
      } else {
        const reader = r.body.getReader();
        const dec = new TextDecoder();
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          const t = dec.decode(value, { stream: true });
          if (!t) continue;
          full += t;
          append(a, full === t ? t.replace(/^\s+/, "") : t);
        }
        if (!full.trim()) append(a, "I don't know that one. Try emailing Hector.");
        else history.push({ role: "assistant", content: full.trim() });
      }
    } catch {
      if (!full) append(a, "Couldn't reach the assistant. Try again later.");
      history.pop();
    }
    a.classList.remove("typing");
    btn.disabled = false;
    input.focus();
  });
})();
</script>
</body>
</html>
